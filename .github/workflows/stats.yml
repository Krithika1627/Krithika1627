name: Update README cards
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Krithika1627&show_icons=true&theme=tokyonight&hide_border=true&title_color=378ADD&icon_color=378ADD
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Krithika1627&layout=compact&theme=tokyonight&hide_border=true&title_color=378ADD
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p profile
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
